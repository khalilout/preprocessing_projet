version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: preprocessing-backend
    ports:
      - "8000:8000"
    networks:
      - preprocessing-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: preprocessing-frontend
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - preprocessing-network
    restart: unless-stopped

networks:
  preprocessing-network:
    driver: bridge